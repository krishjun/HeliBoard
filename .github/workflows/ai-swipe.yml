name: AI swipe validation

on:
  push:
    branches: [codex/ai-swipe-completion]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-swipe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        cloud: [false, true]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Test and build keyboard
        shell: bash
        run: |
          chmod +x gradlew
          if ./gradlew :app:testDebugUnitTest --tests '*AiSwipe*' :app:assembleDebugNoMinify -PaiSwipe=${{ matrix.cloud }} --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx3g' > build.log 2>&1; then
            tail -n 80 build.log
          else
            tail -n 160 build.log
            exit 1
          fi
      - name: Check production Firebase App Check compilation
        if: matrix.cloud
        shell: bash
        run: |
          if ./gradlew :app:compileReleaseKotlin -PaiSwipe=true --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx3g' > release-compile.log 2>&1; then
            tail -n 40 release-compile.log
          else
            tail -n 120 release-compile.log
            exit 1
          fi
      - name: Archive exact source
        if: always() && matrix.cloud
        run: git archive --format=zip --output=source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always() && matrix.cloud
        with:
          name: ai-swipe-source
          path: source.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-swipe-validation-cloud-${{ matrix.cloud }}
          path: |
            build.log
            release-compile.log
            app/build/reports
            app/build/test-results
            app/build/outputs/apk
            app/build/intermediates/merged_manifests
          retention-days: 7
