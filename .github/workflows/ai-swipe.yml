name: AI swipe validation

on:
  push:
    branches: [codex/ai-swipe-completion]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-swipe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.repository == 'krishjun/HeliBoard' && github.ref == 'refs/heads/codex/ai-swipe-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply checksum-verified sentence source changes
        id: source
        shell: bash
        run: |
          if test -d tools/ai-sentence-patch; then
            python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          encoded = ''.join(Path(f'tools/ai-sentence-patch/part{i}.b64').read_text().strip() for i in range(3))
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '76ecd45cadf2a93df78c8571dd7c09ea6e92bb441a0dbcdb3491a2d0f8cd2368', 'Source transfer checksum mismatch'
          Path('/tmp/ai-sentence.patch').write_bytes(patch)
          PY
            git apply --check /tmp/ai-sentence.patch
            git apply /tmp/ai-sentence.patch
            git rm -r tools/ai-sentence-patch
            git add app
            git diff --cached --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat: add continuous sentence swipe decoding, alternatives, preview and guarded undo'
            git push origin HEAD:refs/heads/codex/ai-swipe-completion
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  validate:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        cloud: [false, true]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Test and build keyboard
        shell: bash
        run: |
          chmod +x gradlew
          if ./gradlew :app:testDebugUnitTest --tests '*AiSwipe*' :app:assembleDebugNoMinify -PaiSwipe=${{ matrix.cloud }} --continue --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx3g' > build.log 2>&1; then
            tail -n 80 build.log
          else
            tail -n 160 build.log
            exit 1
          fi
      - name: Verify merged manifest privacy and package boundaries
        run: python3 tools/check-ai-swipe-manifest.py ${{ matrix.cloud }}
      - name: Check production Firebase App Check compilation
        if: matrix.cloud
        shell: bash
        run: |
          if ./gradlew :app:compileReleaseKotlin -PaiSwipe=true --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx3g' > release-compile.log 2>&1; then
            tail -n 40 release-compile.log
          else
            tail -n 120 release-compile.log
            exit 1
          fi
      - name: Archive exact source
        if: always() && matrix.cloud
        run: git archive --format=zip --output=source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always() && matrix.cloud
        with:
          name: ai-swipe-source
          path: source.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-swipe-validation-cloud-${{ matrix.cloud }}
          path: |
            build.log
            release-compile.log
            app/build/reports
            app/build/test-results
            app/build/outputs/apk
            app/build/intermediates/merged_manifests
          retention-days: 7
